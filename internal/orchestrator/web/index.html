<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Semantic Cache</title>
<style>
  :root {
    --ink: #14181f;
    --ink-soft: #5b6570;
    --paper: #f6f7f5;
    --surface: #ffffff;
    --line: #dde1e3;
    --accent: #2f5a78;
    --accent-soft: #e4edf1;
    --hit: #276b4d;
    --hit-bg: #e2f0e7;
    --miss: #93600f;
    --miss-bg: #f7ecd9;
    --error: #a13d2e;
    --error-bg: #f7e2dd;
    --mono-bg: #14181f;
    --mono-fg: #dbe4ea;
    --shadow: 0 1px 2px rgba(20,24,31,0.06), 0 8px 24px rgba(20,24,31,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8ecef;
      --ink-soft: #9aa4ad;
      --paper: #14171c;
      --surface: #1b1f26;
      --line: #2b313b;
      --accent: #7fb2d6;
      --accent-soft: #1e2d36;
      --hit: #7fceac;
      --hit-bg: #16241d;
      --miss: #e3b568;
      --miss-bg: #2a2216;
      --error: #e08a76;
      --error-bg: #2c1c18;
      --mono-bg: #0d1014;
      --mono-fg: #d7e0e6;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 80px;
  }
  main { width: 100%; max-width: 640px; }

  header { margin-bottom: 32px; }
  .eyebrow {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 8px;
  }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 6px; }
  header p { margin: 0; color: var(--ink-soft); font-size: 15px; max-width: 52ch; }

  form {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; box-shadow: var(--shadow);
  }
  textarea {
    width: 100%; min-height: 76px; resize: vertical;
    font: inherit; font-size: 15px; color: var(--ink);
    background: transparent; border: none; outline: none;
    padding: 4px 2px;
  }
  textarea::placeholder { color: var(--ink-soft); }
  .formrow { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .hint { font-size: 12px; color: var(--ink-soft); margin-right: auto; }
  button {
    font: inherit; font-size: 14px; font-weight: 700;
    background: var(--accent); color: var(--surface);
    border: none; border-radius: 8px; padding: 10px 20px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  button:not(:disabled):hover { filter: brightness(1.08); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #result { margin-top: 24px; }
  .empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 32px 0; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px; box-shadow: var(--shadow);
  }
  .card.error { border-color: color-mix(in srgb, var(--error) 40%, transparent); background: var(--error-bg); }

  .statusrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .pill {
    font-size: 12px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .pill.hit { background: var(--hit-bg); color: var(--hit); }
  .pill.miss { background: var(--miss-bg); color: var(--miss); }

  .stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 700; }

  .reply {
    margin-top: 16px; font-size: 15.5px; line-height: 1.6; color: var(--ink);
    white-space: pre-wrap;
  }

  .matches { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .matches .label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
  .match { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .match:last-child { border-bottom: none; }
  .match .rank { color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 1.4em; }
  .match .txt { flex: 1; color: var(--ink); }
  .match .dist { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }

  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: currentColor;
    animation: spin 0.7s linear infinite; display: inline-block; vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { margin-top: 40px; font-size: 12px; color: var(--ink-soft); text-align: center; }
  footer code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">LLM Semantic Cache</p>
    <h1>Ask something</h1>
    <p>Semantically similar questions hit the cache instantly. New ones go to the LLM and get cached for next time.</p>
  </header>

  <form id="query-form">
    <textarea id="prompt" placeholder="e.g. What is virtual memory?" autofocus required></textarea>
    <div class="formrow">
      <span class="hint">⌘/Ctrl + Enter to submit</span>
      <button type="submit" id="submit-btn">Ask</button>
    </div>
  </form>

  <div id="result">
    <p class="empty">Results will appear here.</p>
  </div>

  <footer>Talking to the orchestrator at <code id="origin"></code></footer>
</main>

<script>
  document.getElementById('origin').textContent = location.origin;

  const form = document.getElementById('query-form');
  const promptEl = document.getElementById('prompt');
  const submitBtn = document.getElementById('submit-btn');
  const resultEl = document.getElementById('result');

  promptEl.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') form.requestSubmit();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const prompt = promptEl.value.trim();
    if (!prompt) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Asking…';
    resultEl.innerHTML = '<p class="empty">Asking…</p>';

    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt }),
      });
      const data = await res.json();
      if (!res.ok) {
        renderError(data.error || `HTTP ${res.status}`);
      } else {
        renderResult(data);
      }
    } catch (err) {
      renderError('Could not reach the orchestrator: ' + err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Ask';
    }
  });

  function renderResult(data) {
    const isHit = !!data.cache_hit;
    const pillClass = isHit ? 'hit' : 'miss';
    const pillText = isHit ? 'Cache hit' : 'Cache miss';
    const distanceText = data.distance >= 0 ? data.distance.toFixed(4) : '—';

    let matchesHtml = '';
    if (Array.isArray(data.results) && data.results.length > 1) {
      matchesHtml = `
        <div class="matches">
          <div class="label">All matches (Top-K)</div>
          ${data.results.map((r, i) => `
            <div class="match">
              <span class="rank">${i + 1}.</span>
              <span class="txt">${escapeHtml(r.reply)}</span>
              <span class="dist">${r.distance.toFixed(4)}</span>
            </div>
          `).join('')}
        </div>`;
    }

    resultEl.innerHTML = `
      <div class="card">
        <div class="statusrow">
          <span class="pill ${pillClass}">${pillText}</span>
          <span class="stats">
            <span>source: <b>${escapeHtml(data.source)}</b></span>
            <span>distance: <b>${distanceText}</b></span>
            <span>latency: <b>${data.latency_ms}ms</b></span>
          </span>
        </div>
        <div class="reply">${escapeHtml(data.reply)}</div>
        ${matchesHtml}
      </div>`;
  }

  function renderError(message) {
    resultEl.innerHTML = `<div class="card error">${escapeHtml(message)}</div>`;
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
</script>
</body>
</html>
