# Hosted deployment: only the reverse proxy is reachable from outside.
# The embedding, vector-store, Redis and orchestrator ports stay on the private
# Docker network. Real Gemini answers are required (no stub, no fallback to it).
#
#   cp production.env.example production.env   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file production.env up --build -d
#
# See docs/DEPLOYMENT.md.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - orchestrator

  embedding:
    build: ./embedding_service
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL_BACKEND: "${EMBEDDING_MODEL_BACKEND:-sentence-transformers}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-all-MiniLM-L6-v2}"

  vectorstore:
    build: ./vector_store_service
    restart: unless-stopped
    environment:
      VECTOR_INDEX_BACKEND: "${VECTOR_INDEX_BACKEND:-faiss}"
      SIMILARITY_METRIC: "${SIMILARITY_METRIC:-cosine}"
      VECTOR_DIM: "${VECTOR_DIM:-384}"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  orchestrator:
    build:
      context: .
      dockerfile: deploy/orchestrator.Dockerfile
    restart: unless-stopped
    environment:
      ORCH_ADDR: ":8080"
      EMBEDDING_URL: "http://embedding:8001"
      VECTORSTORE_URL: "http://vectorstore:8002"
      REDIS_ADDR: "redis:6379"
      SIMILARITY_THRESHOLD: "${SIMILARITY_THRESHOLD:-0.25}"
      CACHE_TOP_K: "${CACHE_TOP_K:-1}"
      CACHE_CAPACITY: "${CACHE_CAPACITY:-1000}"
      CACHE_POLICY: "${CACHE_POLICY:-lru}"
      LLM_MODE: "gemini"
      LLM_FALLBACK_MODE: ""
      GEMINI_API_KEY: "${GEMINI_API_KEY:?set GEMINI_API_KEY in production.env}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.1-flash-lite}"
      GEMINI_DAILY_REQUEST_LIMIT: "${GEMINI_DAILY_REQUEST_LIMIT:-0}"
      GEMINI_DAILY_TOKEN_BUDGET: "${GEMINI_DAILY_TOKEN_BUDGET:-0}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN in production.env}"
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-30}"
      # Safe here: the orchestrator is only reachable through Caddy.
      TRUST_PROXY: "true"
      LOG_FILE: "logs/orchestrator.log"
      # Plugin platform: off unless enabled in production.env (see docs/PLUGIN_OPERATIONS.md).
      # It requires ADMIN_TOKEN (already required above) and PLUGIN_SECRET_KEY.
      ENABLE_PLUGIN_INSTALLATION: "${ENABLE_PLUGIN_INSTALLATION:-false}"
      PLUGIN_SECRET_KEY: "${PLUGIN_SECRET_KEY:-}"
      ALLOW_INSECURE_PLUGIN_ENDPOINTS: "false"
      PLUGIN_CONTROLLER_URL: "${PLUGIN_CONTROLLER_URL:-}"
      PLUGIN_CONTROLLER_TOKEN: "${PLUGIN_CONTROLLER_TOKEN:-}"
      PLUGIN_BUILD_TIMEOUT: "${PLUGIN_BUILD_TIMEOUT:-}"
      PLUGIN_HEALTH_TIMEOUT: "${PLUGIN_HEALTH_TIMEOUT:-}"
      PLUGIN_CPU_LIMIT: "${PLUGIN_CPU_LIMIT:-}"
      PLUGIN_MEMORY_LIMIT: "${PLUGIN_MEMORY_LIMIT:-}"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - embedding
      - vectorstore
      - redis

  # ---- Optional: image/repository plugin installation (--profile plugins) --------
  # Needs a Docker daemon the controller may use. That is root-equivalent access to
  # its host: run it on a dedicated build/plugin host or use rootless Docker, and
  # read docs/PLUGIN_SECURITY.md first. Nothing here is published to the internet.
  docker-socket-proxy:
    profiles: [plugins]
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      BUILD: "1"
      POST: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      EXEC: "0"
      VOLUMES: "0"
      SECRETS: "0"
      SWARM: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  plugin-controller:
    profiles: [plugins]
    build:
      context: .
      dockerfile: deploy/controller.Dockerfile
    restart: unless-stopped
    environment:
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      PLUGIN_CONTROLLER_TOKEN: "${PLUGIN_CONTROLLER_TOKEN:-}"   # required (16+ chars) when the plugins profile is used; the controller refuses to start without it
      PLUGIN_CPU_LIMIT: "${PLUGIN_CPU_LIMIT:-1}"
      PLUGIN_MEMORY_LIMIT: "${PLUGIN_MEMORY_LIMIT:-512Mi}"
      PLUGIN_BUILD_TIMEOUT: "${PLUGIN_BUILD_TIMEOUT:-10m}"
      PLUGIN_HEALTH_TIMEOUT: "${PLUGIN_HEALTH_TIMEOUT:-60s}"
      PLUGIN_SCANNER: "${PLUGIN_SCANNER:-none}"
      PLUGIN_REQUIRE_SCAN: "${PLUGIN_REQUIRE_SCAN:-false}"
    depends_on:
      - docker-socket-proxy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
