apiVersion: llmcache.dev/v1alpha1
kind: Plugin

metadata:
  name: sdk-numpy-index
  version: 1.0.0
  description: Python VectorIndex example

spec:
  type: vector-index

  runtime:
    mode: python

  python:
    module: sdk_numpy_index
    backend: sdk-numpy
    requirements: requirements.txt

  health:
    path: /health
    timeout: 5s

  resources:
    cpu: 500m
    memory: 512Mi
