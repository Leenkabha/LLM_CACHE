apiVersion: llmcache.dev/v1alpha1
kind: Plugin

metadata:
  name: sdk-memory-queue
  version: 1.0.0
  description: In-memory lease-based cache-update queue

spec:
  type: queue

  runtime:
    mode: container
    dockerfile: Dockerfile
    port: 8080

  health:
    path: /health
    timeout: 5s

  resources:
    cpu: 250m
    memory: 128Mi
