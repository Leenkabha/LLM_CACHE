apiVersion: llmcache.dev/v1alpha1
kind: Plugin

metadata:
  name: sdk-lru-policy
  version: 1.0.0
  description: Least-recently-used eviction policy

spec:
  type: policy

  runtime:
    mode: container
    dockerfile: Dockerfile
    port: 8080

  health:
    path: /health
    timeout: 5s

  resources:
    cpu: 250m
    memory: 128Mi
