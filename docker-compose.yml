# Local deployment of the LLM Semantic Cache with production-like process
# boundaries. Each component is its own container; they talk over REST/HTTP.
services:
  embedding:
    build: ./embedding_service
    ports:
      - "8001:8001"
    environment:
      # Pluggable embedding model inside the service (see embedding_service/app/models.py).
      EMBEDDING_MODEL_BACKEND: "${EMBEDDING_MODEL_BACKEND:-sentence-transformers}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-all-MiniLM-L6-v2}"

  vectorstore:
    build: ./vector_store_service
    ports:
      - "8002:8002"
    environment:
      # Pluggable index engine + similarity metric (see vector_store_service/app/).
      VECTOR_INDEX_BACKEND: "${VECTOR_INDEX_BACKEND:-faiss}"
      SIMILARITY_METRIC: "${SIMILARITY_METRIC:-cosine}"
      VECTOR_DIM: "${VECTOR_DIM:-384}"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  orchestrator:
    build:
      context: .
      dockerfile: deploy/orchestrator.Dockerfile
    ports:
      - "8080:8080"
    environment:
      ORCH_ADDR: ":8080"
      EMBEDDING_URL: "http://embedding:8001"
      VECTORSTORE_URL: "http://vectorstore:8002"
      REDIS_ADDR: "redis:6379"
      SIMILARITY_THRESHOLD: "${SIMILARITY_THRESHOLD:-0.25}"
      CACHE_TOP_K: "${CACHE_TOP_K:-1}"
      CACHE_CAPACITY: "${CACHE_CAPACITY:-1000}"
      CACHE_POLICY: "${CACHE_POLICY:-lru}"
      # Pluggable adapters the orchestrator selects for each seam.
      EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-http}"
      VECTORSTORE_BACKEND: "${VECTORSTORE_BACKEND:-http}"
      PERSISTENCE_BACKEND: "${PERSISTENCE_BACKEND:-redis}"
      QUEUE_BACKEND: "${QUEUE_BACKEND:-redis}"
      LLM_MODE: "${LLM_MODE:-stub}"
      LLM_FALLBACK_MODE: "${LLM_FALLBACK_MODE:-}"
      # Optional custom-provider example; used only with LLM_MODE=example-http.
      EXAMPLE_LLM_URL: "${EXAMPLE_LLM_URL:-http://example-llm:8090/complete}"
      EXAMPLE_LLM_MODEL: "${EXAMPLE_LLM_MODEL:-demo}"
      EXAMPLE_LLM_TOKEN: "${EXAMPLE_LLM_TOKEN:-}"
      EXAMPLE_LLM_TIMEOUT: "${EXAMPLE_LLM_TIMEOUT:-30s}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-flash-latest}"
      GEMINI_DAILY_REQUEST_LIMIT: "${GEMINI_DAILY_REQUEST_LIMIT:-0}"
      GEMINI_DAILY_TOKEN_BUDGET: "${GEMINI_DAILY_TOKEN_BUDGET:-0}"
      LOG_FILE: "${LOG_FILE:-logs/orchestrator.log}"
      # Plugin platform. Everything is OFF unless you enable it; see docs/PLUGIN_PLATFORM.md.
      # Management needs ADMIN_TOKEN and PLUGIN_SECRET_KEY as well as the switch below.
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      ENABLE_PLUGIN_INSTALLATION: "${ENABLE_PLUGIN_INSTALLATION:-false}"
      PLUGIN_SECRET_KEY: "${PLUGIN_SECRET_KEY:-}"
      ALLOW_INSECURE_PLUGIN_ENDPOINTS: "${ALLOW_INSECURE_PLUGIN_ENDPOINTS:-false}"
      PLUGIN_CONTROLLER_URL: "${PLUGIN_CONTROLLER_URL:-}"
      PLUGIN_CONTROLLER_TOKEN: "${PLUGIN_CONTROLLER_TOKEN:-}"
      PLUGIN_BUILD_TIMEOUT: "${PLUGIN_BUILD_TIMEOUT:-}"
      PLUGIN_HEALTH_TIMEOUT: "${PLUGIN_HEALTH_TIMEOUT:-}"
      PLUGIN_CPU_LIMIT: "${PLUGIN_CPU_LIMIT:-}"
      PLUGIN_MEMORY_LIMIT: "${PLUGIN_MEMORY_LIMIT:-}"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - embedding
      - vectorstore
      - redis

  # On-demand client: `docker compose run --rm cli query "hello"`
  cli:
    build:
      context: .
      dockerfile: deploy/cli.Dockerfile
    environment:
      ORCH_URL: "http://orchestrator:8080"
    depends_on:
      - orchestrator
    profiles:
      - tools

  # Optional deterministic provider for trying the extension contract.
  example-llm:
    profiles: [example-llm]
    build:
      context: .
      dockerfile: examples/llm-server/Dockerfile
    ports:
      - "127.0.0.1:8090:8090"

  # ---- Optional: image and repository plugin installation -----------------------
  # Start with:  docker compose --profile plugins up --build -d
  # and set ENABLE_PLUGIN_INSTALLATION=true, ADMIN_TOKEN, PLUGIN_SECRET_KEY,
  # PLUGIN_CONTROLLER_URL=http://plugin-controller:8090 and PLUGIN_CONTROLLER_TOKEN in .env.
  #
  # SECURITY: access to a Docker daemon is effectively root on that host. Neither the
  # orchestrator nor the web UI gets it. Only the controller reaches the daemon, and
  # only through this filtering proxy (no exec, volumes, secrets, swarm or system API).
  # The proxy narrows the API surface; container creation is still powerful, so treat
  # the controller as a privileged component. See docs/PLUGIN_SECURITY.md.
  docker-socket-proxy:
    profiles: [plugins]
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      BUILD: "1"
      POST: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      EXEC: "0"
      VOLUMES: "0"
      SECRETS: "0"
      SWARM: "0"
      SYSTEM: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      PLUGINS: "0"
      AUTH: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # not published: reachable only from the controller on the compose network

  plugin-controller:
    profiles: [plugins]
    build:
      context: .
      dockerfile: deploy/controller.Dockerfile
    restart: unless-stopped
    environment:
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      PLUGIN_CONTROLLER_TOKEN: "${PLUGIN_CONTROLLER_TOKEN:-}"   # required (16+ chars) when the plugins profile is used; the controller refuses to start without it
      PLUGIN_CPU_LIMIT: "${PLUGIN_CPU_LIMIT:-1}"
      PLUGIN_MEMORY_LIMIT: "${PLUGIN_MEMORY_LIMIT:-512Mi}"
      PLUGIN_BUILD_TIMEOUT: "${PLUGIN_BUILD_TIMEOUT:-10m}"
      PLUGIN_HEALTH_TIMEOUT: "${PLUGIN_HEALTH_TIMEOUT:-60s}"
      PLUGIN_SCANNER: "${PLUGIN_SCANNER:-none}"
      PLUGIN_REQUIRE_SCAN: "${PLUGIN_REQUIRE_SCAN:-false}"
      # Development conveniences; keep them false in production.
      PLUGIN_ALLOW_LOCAL_IMAGES: "${PLUGIN_ALLOW_LOCAL_IMAGES:-false}"
      PLUGIN_ALLOW_LOCAL_GIT: "${PLUGIN_ALLOW_LOCAL_GIT:-false}"
      PLUGIN_ALLOW_EGRESS: "${PLUGIN_ALLOW_EGRESS:-false}"
    depends_on:
      - docker-socket-proxy
    # not published: only the orchestrator (same compose network) may call it
