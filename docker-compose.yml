# Local deployment of the LLM Semantic Cache with production-like process
# boundaries. Each component is its own container; they talk over REST/HTTP.
services:
  embedding:
    build: ./embedding_service
    ports:
      - "8001:8001"
    environment:
      # Pluggable embedding model inside the service (see embedding_service/app/models.py).
      EMBEDDING_MODEL_BACKEND: "${EMBEDDING_MODEL_BACKEND:-sentence-transformers}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-all-MiniLM-L6-v2}"

  vectorstore:
    build: ./vector_store_service
    ports:
      - "8002:8002"
    environment:
      # Pluggable index engine + similarity metric (see vector_store_service/app/).
      VECTOR_INDEX_BACKEND: "${VECTOR_INDEX_BACKEND:-faiss}"
      SIMILARITY_METRIC: "${SIMILARITY_METRIC:-cosine}"
      VECTOR_DIM: "${VECTOR_DIM:-384}"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  orchestrator:
    build:
      context: .
      dockerfile: deploy/orchestrator.Dockerfile
    ports:
      - "8080:8080"
    environment:
      ORCH_ADDR: ":8080"
      EMBEDDING_URL: "http://embedding:8001"
      VECTORSTORE_URL: "http://vectorstore:8002"
      REDIS_ADDR: "redis:6379"
      SIMILARITY_THRESHOLD: "${SIMILARITY_THRESHOLD:-0.25}"
      CACHE_TOP_K: "${CACHE_TOP_K:-1}"
      CACHE_CAPACITY: "${CACHE_CAPACITY:-1000}"
      CACHE_POLICY: "${CACHE_POLICY:-lru}"
      # Pluggable adapters the orchestrator selects for each seam.
      EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-http}"
      VECTORSTORE_BACKEND: "${VECTORSTORE_BACKEND:-http}"
      PERSISTENCE_BACKEND: "${PERSISTENCE_BACKEND:-redis}"
      QUEUE_BACKEND: "${QUEUE_BACKEND:-redis}"
      LLM_MODE: "${LLM_MODE:-stub}"
      LLM_FALLBACK_MODE: "${LLM_FALLBACK_MODE:-}"
      # Optional custom-provider example; used only with LLM_MODE=example-http.
      EXAMPLE_LLM_URL: "${EXAMPLE_LLM_URL:-http://example-llm:8090/complete}"
      EXAMPLE_LLM_MODEL: "${EXAMPLE_LLM_MODEL:-demo}"
      EXAMPLE_LLM_TOKEN: "${EXAMPLE_LLM_TOKEN:-}"
      EXAMPLE_LLM_TIMEOUT: "${EXAMPLE_LLM_TIMEOUT:-30s}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-flash-latest}"
      LOG_FILE: "${LOG_FILE:-logs/orchestrator.log}"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - embedding
      - vectorstore
      - redis

  # On-demand client: `docker compose run --rm cli query "hello"`
  cli:
    build:
      context: .
      dockerfile: deploy/cli.Dockerfile
    environment:
      ORCH_URL: "http://orchestrator:8080"
    depends_on:
      - orchestrator
    profiles:
      - tools

  # Optional deterministic provider for trying the extension contract.
  example-llm:
    profiles: [example-llm]
    build:
      context: .
      dockerfile: examples/llm-server/Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
